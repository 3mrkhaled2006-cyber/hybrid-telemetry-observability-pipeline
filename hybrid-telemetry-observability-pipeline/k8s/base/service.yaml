apiVersion: v1
kind: Service
metadata:
  name: hybrid-telemetry-pipeline
  namespace: telemetry-system
  labels:
    app.kubernetes.io/name: hybrid-telemetry-pipeline
    prometheus.io/scrape: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hybrid-telemetry-pipeline
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
    - name: metrics
      port: 9102
      targetPort: metrics
      protocol: TCP
