global:
  scrape_interval: 2s
  evaluation_interval: 2s
  scrape_timeout: 1s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "hybrid-telemetry-pipeline"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["telemetry-pipeline:9102"]
        labels:
          environment: "production"
          service: "telemetry-pipeline"
          facility: "cern-lhc-sector-sim"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
