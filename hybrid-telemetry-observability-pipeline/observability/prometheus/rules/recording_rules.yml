groups:
  - name: telemetry_recording_rules
    interval: 2s
    rules:
      - record: job:telemetry_samples:rate1m
        expr: sum(rate(telemetry_samples_processed_total[1m]))

      - record: job:telemetry_anomalies:rate1m
        expr: sum(rate(telemetry_anomalies_detected_total[1m]))

      - record: job:telemetry_dsp_latency:p99_1m
        expr: histogram_quantile(0.99, sum(rate(telemetry_dsp_processing_latency_seconds_bucket[1m])) by (le))

      - record: job:telemetry_dsp_latency:p50_1m
        expr: histogram_quantile(0.50, sum(rate(telemetry_dsp_processing_latency_seconds_bucket[1m])) by (le))

      - record: job:telemetry_cryo_temp:max
        expr: max(telemetry_cryo_temperature_kelvin)

      - record: job:telemetry_error_rate:ratio_5m
        expr: |
          sum(rate(telemetry_anomalies_detected_total{alarm_status=~"CRITICAL_QUENCH|BEAM_DUMP_TRIGGERED"}[5m]))
          /
          (sum(rate(telemetry_samples_processed_total[5m])) + 1e-6)
